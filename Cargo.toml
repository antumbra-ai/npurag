[package]
name = "npurag"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Grzegorz Oleksy"]
description = "On-device semantic search and RAG over a local directory, via any OpenAI-compatible backend"
repository = "https://github.com/antumbra-ai/npurag"
license = "Apache-2.0"
readme = "README.md"
keywords = ["semantic-search", "rag", "embeddings", "npu", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
ureq = { version = "3", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"
