[package]
name = "npurag"
version = "0.1.0"
edition = "2021"
# Floor imposed by the dependency tree (time / cookie_store, via ureq).
# CI verifies this against a real toolchain rather than trusting the number.
rust-version = "1.88"
authors = ["Grzegorz Oleksy"]
description = "On-device semantic search and RAG over a local directory, via any OpenAI-compatible backend"
repository = "https://github.com/antumbra-ai/npurag"
license = "Apache-2.0"
readme = "README.md"
keywords = ["semantic-search", "rag", "embeddings", "npu", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "1.8.6"
ignore = "0.4.33"
globset = "0.4.20"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3.27.0"
