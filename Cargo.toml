[package]
name = "npurag"
version = "0.3.1"
edition = "2021"
# Floor imposed by the dependency tree (time / cookie_store, via ureq).
# CI verifies this against a real toolchain rather than trusting the number.
rust-version = "1.88"
authors = ["Grzegorz Oleksy"]
description = "On-device semantic search and RAG over a local directory, via any OpenAI-compatible backend"
repository = "https://github.com/antumbra-ai/npurag"
license = "Apache-2.0"
readme = "README.md"
keywords = ["semantic-search", "rag", "embeddings", "npu", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "1.8.6"
ignore = "0.4.33"
globset = "0.4.20"
pdf-extract = { version = "0.12.0", optional = true }
html2text = { version = "0.17.1", optional = true }
dotext = { version = "0.1.1", optional = true }
notify = "8.2.0"
indicatif = "0.18.6"
simsimd = { version = "6.5.16", optional = true }
tiny_http = "0.12.0"

[features]
# Extractors are opt-in: they pull heavy dependency trees, and an index of
# text and code needs none of them. A format whose extractor is not compiled
# in is skipped with a count, never a failure.
default = []
pdf = ["dep:pdf-extract"]
office = ["dep:dotext"]
html = ["dep:html2text"]
extractors = ["pdf", "office", "html"]
# Hand-written cosine is already fast enough for a personal index; this swaps in
# simsimd's kernels for the cases where it is not.
simd = ["dep:simsimd"]
simsimd = ["dep:simsimd"]

[profile.release]
# Release binaries are downloaded, not built, so size and speed are worth the
# longer compile.
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": the PDF extractor relies on catch_unwind to
# survive a malformed file, and aborting would turn one bad document into a
# failed run over thousands of good ones.

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3.27.0"
